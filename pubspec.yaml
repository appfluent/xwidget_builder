name: xwidget_builder
description: "Development tool for generating XWidget components to build dynamic Flutter UIs with XML based markup."
version: 0.7.0
repository: https://github.com/appfluent/xwidget_builder
issue_tracker: https://github.com/appfluent/xwidget_builder/issues

topics:
  - code-generation
  - server-driven-ui
  - cli
  - xml
  - widgets

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  analyzer: ">=13.0.0 <14.0.0"
  archive: ^4.0.7
  args: ^2.4.2
  crypto: ^3.0.7
  dio: ^5.9.1
  encrypt: ^5.0.3
  glob: ^2.1.3
  http: ^1.1.0
  interact2: ^4.0.0
  markdown: ^7.3.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  xwidget:

flutter: